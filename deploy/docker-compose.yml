# sc 单机「基础可靠」部署（非多实例 HA；演进路径见 DEPLOY.md 末尾）。
# 用法：cp backend/.env.example backend/.env  →  填 SC_LLM_*  →  cd deploy && docker compose up -d --build
#
# 三个服务：
#   backend  单 uvicorn 进程（架构不变量，见 DEPLOY.md「单进程原理」），崩溃自愈靠 restart
#   frontend nginx 托管 SPA + /api 前缀剥离反代 backend（同源，免 CORS）
#   backup   复用后端镜像跑备份循环（SQLite 热备，只读源库写独立 .bak，不构成第二写者）
# 卷：
#   sc-data    唯一不可丢失状态：sc.db(+WAL/SHM) + 批量上传临时文件（TMPDIR）
#   sc-backups 备份产物（保留 N 份，与 DB 卷物理隔离，便于恢复演练）
services:
  backend:
    build: ../backend
    image: sc-backend:latest
    env_file: ../backend/.env
    environment:
      SC_DATABASE_URL: "sqlite:////data/sc.db"   # 卷内持久化（覆盖 env_file）
      TMPDIR: /data/tmp                          # 批量 tempfile 挂卷：重启后 failed item 可重试
    volumes:
      - sc-data:/data
    ports:
      - "127.0.0.1:8000:8000"                    # 仅本机调试/验证，不对外
    restart: unless-stopped
    stop_grace_period: 180s                      # > LLM 120s 超时，容在途请求跑完
    healthcheck:
      # readiness：DB 可达才 healthy（依赖不可用 503 → 触发重启自愈）
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    build: ../frontend/app
    image: sc-frontend:latest
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy               # backend 就绪后才接流量
    restart: unless-stopped
    stop_grace_period: 30s

  backup:
    image: sc-backend:latest                     # 复用后端镜像，只跑备份循环
    command: ["/app/scripts/backup_loop.sh"]
    env_file: ../backend/.env
    environment:
      SC_DATABASE_URL: "sqlite:////data/sc.db"
      # Phase 4 批次C：§9 保留期限的备份侧——旧份 gzip 归档（0=关）
      SC_BACKUP_COMPRESS_DAYS: ${SC_BACKUP_COMPRESS_DAYS:-0}
    volumes:
      - sc-data:/data
      - sc-backups:/backups
    healthcheck:
      disable: true   # 复用镜像内置 HEALTHCHECK（指向 uvicorn :8000），本容器只跑备份循环
    restart: unless-stopped
    depends_on:
      - backend

  # ---- Phase 1（agent-product-design §10.1）：会话网关 + runtime 魔改壳 ----
  # 装车批第 3 步：镜像直启 runtime Bazel 产物 codex-app-server（无子命令，args 空）。
  # 装车批第 5 步：sc MCP python 迁入 backend 容器（streamable-http 挂 /mcp），本
  # 服务**不再挂 sc-data 卷**——agent 物理不可达 sc.db，直接 DB 读写路径被拓扑切断；
  # codex 的 [mcp_servers.sc] 以 url=http://backend:8000/mcp 连入，教师身份逐请求
  # 经 Authorization Bearer（SC_SCHOOL_AUTH_TOKEN）由 backend 验签。school-authz-mcp
  # shim 退役。env_file=backend/.env：网关进程侧要 SC_AUTH_SECRET（签教师 token）、
  # SC_TRIGGER_KEY（验 /internal/*）、SC_LLM_API_KEY（CODEX_HOME 播种）；SC_LLM_*/
  # SC_AUTH_SECRET 等共享密钥不进 agent 子进程（_child_env 白名单）。
  gateway:
    build: ../gateway
    image: sc-gateway:latest
    env_file: ../backend/.env
    environment:
      SC_GATEWAY_CODEX_HOME: /data/codex-home
      # gateway 直启 runtime 魔改壳（无子命令；空 args → main.py split() 得 []）
      SC_GATEWAY_APP_SERVER: codex-app-server
      SC_GATEWAY_APP_SERVER_ARGS: ""
      SC_GATEWAY_ASSETS: /app/assets/deepseek      # CODEX_HOME 首启播种模板位置
      SC_BACKEND_URL: http://backend:8000         # 月度软限额巡查数据源（§5.7）
      SC_BUDGET_MAX_TURNS: "12"
      SC_BUDGET_MAX_TOKENS: "200000"
      SC_BUDGET_MONTHLY_LIMIT: "0"                # 0=不限；学校按需设
      SC_DINGTALK_ENABLED: "0"
      SC_DINGTALK_WEBHOOK: ""
      SC_DINGTALK_SECRET: ""
      # Phase 4 批次B：每日出站心跳（§8.3；URL 未配置=静默空转，规模期开启）
      SC_HEARTBEAT_URL: ${SC_HEARTBEAT_URL:-}
      SC_BOX_ID: ${SC_BOX_ID:-}                   # 缺省取主机名
      SC_BOX_VERSION: ${SC_BOX_VERSION:-}
      # Phase 4 批次C：rollout 保留期限（§9；默认 0=永不删——一班一线程
      # 持久记忆落在 rollout，清理=该班记忆重开，学校知情后配置）
      SC_RETENTION_ROLLOUT_DAYS: ${SC_RETENTION_ROLLOUT_DAYS:-0}
    volumes:
      - gw-codex-home:/data/codex-home            # CODEX_HOME 持久化（rollout/线程记忆）
    ports:
      - "127.0.0.1:8100:8100"                    # 同 backend：仅本机调试，生产走 nginx 反代
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s                       # > app-server 单 turn 收尾余量

volumes:
  sc-data:
  sc-backups:
  gw-codex-home:
