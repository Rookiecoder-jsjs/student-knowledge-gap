      name="description"

    <script>
      (function () {
        try {
          var mode = localStorage.getItem("sc.theme");
          var dark = mode === "dark" || (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.dataset.theme = "dark";
        } catch (e) {}
      })();
    </script>
