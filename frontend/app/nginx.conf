# sc 前端 nginx：静态托管 dist + /api 前缀剥离反代 backend。
# 复刻 vite.config.ts 的 dev 代理 rewrite（/api -> backend:8000，去掉 /api 前缀）。
# 后端路由挂在 root（无 /api 前缀），前端一律请求 /api/*，故生产必须同源反代剥离。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback（react-router）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # vite 构建产物带内容哈希，长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 同源 API 反代：proxy_pass 尾斜杠使 nginx 用「匹配前缀后的剩余路径」——
    # /api/students -> /students，与前端 rewrite(/^\/api/, '') 逐字节等价。
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;    # > LLM 120s 超时，容拍照/批量解析在途请求
        client_max_body_size 110m;  # 批量上传上限 100MB + multipart 开销
    }

    # nginx 自身存活探针
    location = /healthz { return 200 'ok'; }

    # 就绪探针透传（外部监控 / 编排器用）
    location = /ready { proxy_pass http://backend:8000/ready; }
}
