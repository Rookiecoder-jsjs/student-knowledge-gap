# sc 前端 nginx：静态托管 dist + /api 前缀剥离反代 backend。
# 复刻 vite.config.ts 的 dev 代理 rewrite（/api -> backend:8000，去掉 /api 前缀）。
# 后端路由挂在 root（无 /api 前缀），前端一律请求 /api/*，故生产必须同源反代剥离。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback（react-router）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # vite 构建产物带内容哈希，长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 同源 API 反代：proxy_pass 尾斜杠使 nginx 用「匹配前缀后的剩余路径」——
    # /api/students -> /students，与前端 rewrite(/^\/api/, '') 逐字节等价。
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;    # > LLM 超时（SC_LLM_TIMEOUT 可调，默认 120s），容学习方案/批量解析在途请求
        client_max_body_size 110m;  # 批量上传上限 100MB + multipart 开销
    }

    # nginx 自身存活探针
    location = /healthz { return 200 'ok'; }

    # 会话网关（AI 教研员，DEPLOY.md §8）：同源反代到 gateway 容器。
    # 网关自身不配 CORS（只面对同源反代），故浏览器侧必须经此处而非直连 8100；
    # 与 vite.config.ts 的 dev 代理同构。
    location = /rpc {
        proxy_pass http://gateway:8100/rpc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;   # turn/start 阻塞至 turn 完成（agent 多轮工具调用）
    }

    # SSE 事件流：必须关缓冲，否则事件积压在 nginx 不到达浏览器
    location /threads/ {
        proxy_pass http://gateway:8100/threads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;  # 长连接：SSE 常驻
    }

    # 就绪探针透传（外部监控 / 编排器用）
    location = /ready { proxy_pass http://backend:8000/ready; }
}
