[project]
name = "sc"
version = "0.1.0"
description = "知行教研教学质量分析平台（DESIGN.md v0.3 MVP）"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2.0",
    "alembic",
    "pyyaml",
    "networkx",
    "openpyxl",
    "httpx",
    "python-multipart",
    "pytest",
    "mcp",
]

[tool.pytest.ini_options]
testpaths = ["tests", "simulator"]
