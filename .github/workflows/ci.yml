name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Run tests (unit + gold + stress)
        working-directory: backend
        run: python -m pytest tests simulator -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - name: Install dependencies
        working-directory: frontend/app
        run: npm ci
      - name: Lint
        working-directory: frontend/app
        run: npx oxlint .
      - name: Build
        working-directory: frontend/app
        run: npm run build

  docker:
    # 防镜像/compose bit-rot：镜像可构建 + compose 语法正确性进 CI
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --pull -t sc-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t sc-frontend:ci ./frontend/app
      - name: Validate docker compose
        run: |
          touch backend/.env   # env_file 占位；真实值由运维本地提供（见 DEPLOY.md）
          docker compose -f deploy/docker-compose.yml config -q
