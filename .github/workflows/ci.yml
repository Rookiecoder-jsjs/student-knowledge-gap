name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Verify job API schema
        working-directory: backend
        run: python -m scripts.export_job_contract --check
      - name: Run tests (unit + gold + stress)
        working-directory: backend
        run: python -m pytest tests simulator -q

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked dependencies and test runner
        working-directory: gateway
        run: python -m pip install -r requirements.txt pytest
      - name: Run gateway tests
        working-directory: gateway
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - name: Install dependencies
        working-directory: frontend/app
        run: npm ci
      - name: Verify generated job types
        working-directory: frontend/app
        run: |
          npm ci --prefix tools/api-contract
          npm run gen-api
          git diff --exit-code -- src/lib/generated/jobs.ts
      - name: Lint
        working-directory: frontend/app
        run: npx oxlint .
      - name: Build
        working-directory: frontend/app
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - name: Install test dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          npm ci --prefix frontend/app
      - name: Install Chromium
        working-directory: frontend/app
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests
        working-directory: frontend/app
        run: npm run test:e2e
      - name: Retain traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: |
            frontend/app/playwright-report/
            frontend/app/test-results/

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/site/package-lock.json
      - name: Install dependencies
        working-directory: frontend/site
        run: npm ci
      - name: Lint
        working-directory: frontend/site
        run: npx oxlint .
      - name: Build
        working-directory: frontend/site
        run: npm run build

  docker:
    # 防镜像/compose bit-rot：镜像可构建 + compose 语法正确性进 CI
    runs-on: ubuntu-latest
    needs: [backend, frontend, site]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --pull -t sc-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t sc-frontend:ci ./frontend/app
      - name: Build site image
        run: docker build -t sc-site:ci ./frontend/site
      - name: Validate docker compose
        run: |
          touch backend/.env   # env_file 占位；真实值由运维本地提供（见 DEPLOY.md）
          docker compose -f deploy/docker-compose.yml config -q
